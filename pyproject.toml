[project]
name = "ioc-watchlist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Muhammed Musaddique", email = "musaddique092@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "ioc-fanger>=5.1.1",
    "python-multipart>=0.0.33",
    "url-normalize>=3.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ioc-watchlist = "ioc_watchlist:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
